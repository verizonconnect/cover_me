[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cover_me"
version = "0.1.0"
description = "Database code coverage tool for PostgreSQL and MySQL"
requires-python = ">=3.10"
dependencies = [
    "psycopg2-binary",
    "mysql-connector-python",
    "lxml",
]

[project.scripts]
cover_me = "cover_me.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
